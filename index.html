<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق حسب النقاط</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f3f3f3;
    color: #111;
    font-family: Arial, sans-serif;
}

.container {
    width: 95%;
    max-width: 900px;
    margin: 0 auto;
    padding: 15px;
}

/* =========================
   الرأس
========================= */

.header {
    position: relative;
    min-height: 95px;
    background: #fff;
    border-radius: 15px;
    padding: 12px 15px;
    margin-bottom: 18px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
}

.header-title {
    font-size: 21px;
    font-weight: bold;
    text-align: center;
}

.header-right {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 18px;
    font-weight: bold;
}

.header-left {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    font-weight: bold;
    direction: ltr;
    text-align: left;
}

/* شعار السعودية */

.saudi-logo {
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.saudi-logo img {
    width: 70px;
    height: 70px;
    display: block;
    object-fit: contain;
}

/* =========================
   الأعمال
========================= */

.activity {
    background: #fff;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.10);
}

.activity-title {
    font-size: 18px;
    font-weight: bold;
    line-height: 1.6;
}

.activity-points {
    color: #555;
    font-size: 15px;
    margin-top: 5px;
    margin-bottom: 10px;
}

.activity-input {
    width: 100%;
    height: 45px;
    border: 1px solid #aaa;
    border-radius: 9px;
    padding: 8px 12px;
    font-size: 17px;
    text-align: center;
    outline: none;
    background: #fff;
}

.activity-input:focus {
    border-color: #111;
}

/* =========================
   المجموع
========================= */

.total-box {
    background: #111;
    color: #fff;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    margin-top: 18px;
    font-size: 23px;
    font-weight: bold;
}

/* =========================
   الأزرار
========================= */

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    flex: 1;
    min-width: 150px;
}

.save-btn {
    background: #111;
    color: #fff;
}

.delete-btn {
    background: #c62828;
    color: #fff;
}

.motion-btn {
    background: #ddd;
    color: #111;
}

/* =========================
   تصميم: عادل الشمري
========================= */

.design-credit {
    position: fixed;
    left: 15px;
    bottom: 15px;
    font-size: 15px;
    font-weight: bold;
    transition: transform 0.15s ease;
    transform-origin: center;
    z-index: 10;
}

/* =========================
   الجوال
========================= */

@media (max-width: 600px) {

    .header {
        min-height: 90px;
    }

    .header-title {
        font-size: 18px;
        max-width: 160px;
    }

    .header-right {
        right: 10px;
        font-size: 14px;
    }

    .header-left {
        left: 10px;
        font-size: 18px;
    }

    .saudi-logo {
        width: 55px;
        height: 55px;
    }

    .saudi-logo img {
        width: 55px;
        height: 55px;
    }

    .activity-title {
        font-size: 17px;
    }

    .buttons button {
        min-width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- الرأس -->

    <header class="header">

        <!-- وزارة الداخلية + الشعار -->
        <div class="header-right">
            <span>وزارة الداخلية</span>

            <div class="saudi-logo">
                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/9/99/Emblem_of_Saudi_Arabia.svg"
                    alt="شعار المملكة العربية السعودية">
            </div>
        </div>

        <!-- العنوان -->
        <div class="header-title">
            تطبيق حسب النقاط
        </div>

        <!-- KR في الزاوية اليسار -->
        <div class="header-left">
            KR
        </div>

    </header>


    <!-- الأعمال -->

    <main id="activities"></main>


    <!-- المجموع -->

    <div class="total-box">
        المجموع:
        <span id="total">0</span>
    </div>


    <!-- الأزرار -->

    <div class="buttons">

        <button
            id="saveBtn"
            class="save-btn"
            type="button">
            حفظ البيانات
        </button>

        <button
            id="deleteBtn"
            class="delete-btn"
            type="button">
            حذف البيانات
        </button>

        <button
            id="motionBtn"
            class="motion-btn"
            type="button">
            السماح بحركة الجهاز
        </button>

    </div>

</div>


<!-- تصميم: عادل الشمري -->

<div id="designCredit" class="design-credit">
    تصميم: عادل الشمري
</div>


<script>

/* =========================================
   الأعمال والنقاط
========================================= */

const activities = [
    {
        name: "تدشين نقطة تفتيش متحركة",
        points: 1,
        note: "كل ١/٢ ساعة"
    },
    {
        name: "إستيقاف مروري",
        points: 1,
        note: ""
    },
    {
        name: "تسجيل مخالفة",
        points: 1,
        note: ""
    },
    {
        name: "حضور حملة أمنية (عامة)",
        points: 2,
        note: ""
    },
    {
        name: "حضور حملة أمنية (خاصة)",
        points: 2,
        note: ""
    },
    {
        name: "حضور تدريب (عام-خاص)",
        points: 2,
        note: ""
    },
    {
        name: "إسقاط رجل عصابة",
        points: 2,
        note: ""
    },
    {
        name: "حضور تمشيط",
        points: 3,
        note: ""
    },
    {
        name: "إعتقال عضو عصابة",
        points: 3,
        note: ""
    },
    {
        name: "إعتقال احد رؤساء العصابات",
        points: 5,
        note: "ملاحظة"
    },
    {
        name: "إعتقال احد مسؤولي العصابات",
        points: 20,
        note: "ملاحظة"
    }
];


/* =========================================
   إنشاء الأعمال
========================================= */

const activitiesContainer =
    document.getElementById("activities");

activities.forEach(function(activity, index) {

    const box = document.createElement("section");

    box.className = "activity";

    let pointsText = "";

    if (activity.note === "كل ١/٢ ساعة") {
        pointsText =
            "كل ١/٢ ساعة — (" +
            activity.points +
            ")";
    } else if (activity.note === "ملاحظة") {
        pointsText =
            "ملاحظة — (" +
            activity.points +
            ")";
    } else {
        pointsText =
            "(" +
            activity.points +
            ")";
    }

    box.innerHTML = `
        <div class="activity-title">
            ${index + 1}. ${activity.name}
        </div>

        <div class="activity-points">
            ${pointsText}
        </div>

        <input
            class="activity-input"
            type="number"
            min="0"
            step="1"
            value="0"
            inputmode="numeric"
            data-index="${index}"
            aria-label="${activity.name}"
            placeholder="اكتب العدد">
    `;

    activitiesContainer.appendChild(box);
});


/* =========================================
   حساب المجموع
========================================= */

function calculateTotal() {

    let total = 0;

    const inputs =
        document.querySelectorAll(".activity-input");

    inputs.forEach(function(input) {

        let number =
            parseInt(input.value, 10);

        if (isNaN(number) || number < 0) {
            number = 0;
        }

        const index =
            parseInt(input.dataset.index, 10);

        total +=
            number * activities[index].points;
    });

    document.getElementById("total").textContent =
        total.toLocaleString("ar-SA");

    return total;
}


/* =========================================
   تحديث المجموع عند تغيير الأرقام
========================================= */

document
    .querySelectorAll(".activity-input")
    .forEach(function(input) {

        input.addEventListener(
            "input",
            calculateTotal
        );

    });


/* =========================================
   حفظ البيانات
========================================= */

document
    .getElementById("saveBtn")
    .addEventListener("click", function() {

        const data = [];

        document
            .querySelectorAll(".activity-input")
            .forEach(function(input) {

                data.push(input.value);

            });

        localStorage.setItem(
            "adelPointsData",
            JSON.stringify(data)
        );

        alert("تم حفظ البيانات بنجاح");

    });


/* =========================================
   تحميل البيانات
========================================= */

function loadData() {

    const saved =
        localStorage.getItem("adelPointsData");

    if (!saved) {
        calculateTotal();
        return;
    }

    try {

        const data =
            JSON.parse(saved);

        const inputs =
            document.querySelectorAll(".activity-input");

        inputs.forEach(function(input, index) {

            if (
                Array.isArray(data) &&
                data[index] !== undefined
            ) {
                input.value = data[index];
            }

        });

    } catch (error) {

        console.error(
            "خطأ في قراءة البيانات:",
            error
        );

    }

    calculateTotal();
}


/* =========================================
   حذف البيانات
========================================= */

document
    .getElementById("deleteBtn")
    .addEventListener("click", function() {

        const confirmed =
            confirm(
                "هل أنت متأكد من حذف جميع البيانات؟"
            );

        if (!confirmed) {
            return;
        }

        document
            .querySelectorAll(".activity-input")
            .forEach(function(input) {

                input.value = "0";

            });

        localStorage.removeItem(
            "adelPointsData"
        );

        calculateTotal();

        alert("تم حذف البيانات");

    });


/* =========================================
   حركة تصميم: عادل الشمري
========================================= */

let motionEnabled = false;

document
    .getElementById("motionBtn")
    .addEventListener("click", async function() {

        try {

            /*
             * بعض أجهزة Apple تطلب إذنًا
             * للوصول إلى حركة الجهاز.
             */

            if (
                typeof DeviceOrientationEvent !== "undefined" &&
                typeof DeviceOrientationEvent.requestPermission === "function"
            ) {

                const permission =
                    await DeviceOrientationEvent.requestPermission();

                if (permission !== "granted") {

                    alert(
                        "لم يتم السماح بحركة الجهاز"
                    );

                    return;
                }
            }

            if (motionEnabled) {

                alert(
                    "حركة الجهاز مفعلة بالفعل"
                );

                return;
            }

            window.addEventListener(
                "deviceorientation",
                function(event) {

                    let horizontal =
                        Number(event.gamma) || 0;

                    let vertical =
                        Number(event.beta) || 0;

                    horizontal =
                        Math.max(
                            -30,
                            Math.min(30, horizontal)
                        );

                    vertical =
                        Math.max(
                            -30,
                            Math.min(30, vertical)
                        );

                    const credit =
                        document.getElementById(
                            "designCredit"
                        );

                    credit.style.transform =
                        "translate(" +
                        (horizontal * 0.7) +
                        "px, " +
                        (vertical * 0.25) +
                        "px)";

                },
                {
                    passive: true
                }
            );

            motionEnabled = true;

            this.textContent =
                "حركة الجهاز مفعلة";

            alert(
                "تم السماح بحركة الجهاز"
            );

        } catch (error) {

            console.error(error);

            alert(
                "تعذر تفعيل حركة الجهاز"
            );
        }
    });


/* =========================================
   تشغيل التطبيق
========================================= */

loadData();

</script>

</body>
</html>
