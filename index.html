<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق حسب النقاط</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f2f2;
color:#111;
}

.page{
display:none;
min-height:100vh;
padding:20px;
}

.page.active{
display:block;
}

.card{
max-width:430px;
margin:50px auto;
background:#fff;
padding:25px;
border-radius:18px;
box-shadow:0 4px 15px #0002;
}

h1{
text-align:center;
margin:0 0 8px;
}

.sub{
text-align:center;
color:#666;
margin-bottom:25px;
}

label{
display:block;
font-weight:bold;
margin:14px 0 7px;
}

input{
width:100%;
padding:13px;
border:1px solid #bbb;
border-radius:10px;
font-size:16px;
}

button{
font-family:inherit;
cursor:pointer;
}

.btn{
width:100%;
padding:14px;
border:0;
border-radius:10px;
margin-top:15px;
font-size:17px;
font-weight:bold;
background:#111;
color:#fff;
}

.btn2{
width:100%;
padding:13px;
border:1px solid #222;
border-radius:10px;
margin-top:10px;
font-size:16px;
font-weight:bold;
background:#fff;
color:#111;
}

.msg{
text-align:center;
font-weight:bold;
margin-top:15px;
min-height:22px;
}

.header{
background:#111;
color:#fff;
padding:15px;
border-radius:15px;
display:grid;
grid-template-columns:1fr 1fr 1fr;
align-items:center;
margin-bottom:20px;
}

.right{
display:flex;
align-items:center;
gap:8px;
}

.center{
text-align:center;
font-size:20px;
font-weight:bold;
}

.left{
text-align:left;
}

.logo{
width:48px;
height:48px;
background:#fff;
border-radius:50%;
object-fit:contain;
}

.activities{
max-width:850px;
margin:auto;
}

.activity{
background:#fff;
padding:15px;
border-radius:14px;
margin-bottom:12px;
box-shadow:0 2px 7px #0001;
}

.name{
font-weight:bold;
font-size:17px;
}

.points{
color:#666;
font-size:14px;
margin:7px 0 10px;
}

.total{
max-width:850px;
margin:18px auto;
padding:18px;
background:#111;
color:#fff;
border-radius:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.actions{
max-width:850px;
margin:auto;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.actions button{
flex:1;
min-width:150px;
padding:13px;
border:0;
border-radius:10px;
font-weight:bold;
}

.save{background:#111;color:#fff}
.motion{background:#ddd;color:#111}
.logout{background:#b00020;color:#fff}

.credit{
position:fixed;
bottom:15px;
right:15px;
font-weight:bold;
transition:.15s;
}

@media(max-width:650px){
.header{
grid-template-columns:1fr;
gap:10px;
text-align:center;
}
.right{
justify-content:center;
}
.left{
text-align:center;
}
}
</style>
</head>

<body>

<!-- تسجيل الدخول -->
<section id="loginPage" class="page active">
<div class="card">

<h1>تسجيل الدخول</h1>
<div class="sub">تطبيق حسب النقاط</div>

<label>الاسم الثنائي</label>
<input id="loginName" type="text" placeholder="اكتب الاسم الثنائي">

<label>اليونت العسكري</label>
<input id="loginUnit" type="text" placeholder="اكتب اليونت العسكري">

<label>الرمز الخاص</label>
<input id="loginCode" type="password" placeholder="اكتب الرمز الخاص">

<button id="loginBtn" class="btn" type="button">
تسجيل الدخول
</button>

<button id="openRegister" class="btn2" type="button">
طلب تسجيل جديد
</button>

<div id="loginMsg" class="msg"></div>

</div>
</section>


<!-- التسجيل -->
<section id="registerPage" class="page">
<div class="card">

<h1>طلب تسجيل جديد</h1>
<div class="sub">تطبيق حسب النقاط</div>

<label>الاسم الثنائي</label>
<input id="registerName" type="text" placeholder="اكتب الاسم الثنائي">

<label>اليونت العسكري</label>
<input id="registerUnit" type="text" placeholder="اكتب اليونت العسكري">

<button id="sendRegister" class="btn" type="button">
إرسال طلب التسجيل
</button>

<button id="backLogin" class="btn2" type="button">
العودة لتسجيل الدخول
</button>

<div id="registerMsg" class="msg"></div>

</div>
</section>


<!-- التطبيق -->
<section id="appPage" class="page">

<div class="header">

<div class="right">
<span>وزارة الداخلية</span>
<img
class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/9/99/Emblem_of_Saudi_Arabia.svg"
alt="شعار السعودية">
</div>

<div class="center">
تطبيق حسب النقاط
</div>

<div class="left">
KR
</div>

</div>

<div id="activities" class="activities"></div>

<div class="total">
المجموع:
<span id="total">0</span>
</div>

<div class="actions">

<button id="save" class="save" type="button">
حفظ النقاط
</button>

<button id="motion" class="motion" type="button">
السماح بحركة الجهاز
</button>

<button id="logout" class="logout" type="button">
تسجيل الخروج
</button>

</div>

</section>

<div id="credit" class="credit">
تصميم: عادل الشمري
</div>


<script>

/* ==========================================
   إعداد Supabase
========================================== */

const SUPABASE_URL =
"https://rvgvqooateniymiypraz.supabase.co";

/*
الصق Publishable Key الخاص بمشروعك بين علامتي التنصيص.
لا تستخدم Secret Key أو service_role.
*/

const SUPABASE_KEY =
"بمشروعك بين علامتي التنصيص Publishable Key الصق
/ *
const SUPABASE_KEY =
بوا" الخاص_بمشروعك_Publishable_Key_ الصق_هنا"";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ==========================================
   الصفحات
========================================== */

const loginPage =
document.getElementById("loginPage");

const registerPage =
document.getElementById("registerPage");

const appPage =
document.getElementById("appPage");

function page(pageName){

loginPage.classList.remove("active");
registerPage.classList.remove("active");
appPage.classList.remove("active");

pageName.classList.add("active");

}


/* ==========================================
   فتح صفحة التسجيل
========================================== */

document.getElementById("openRegister").onclick =
function(){

document.getElementById("registerMsg").textContent="";

page(registerPage);

};


/* ==========================================
   العودة
========================================== */

document.getElementById("backLogin").onclick =
function(){

document.getElementById("loginMsg").textContent="";

page(loginPage);

};


/* ==========================================
   الأنشطة
========================================== */

const activitiesData = [

["تدشين نقطة تفتيش متحركة",1,"كل ١/٢ ساعة"],
["إستيقاف مروري",1,""],
["تسجيل مخالفة",1,""],
["حضور حملة أمنية (عامة)",2,""],
["حضور حملة أمنية (خاصة)",2,""],
["حضور تدريب (عام-خاص)",2,""],
["إسقاط رجل عصابة",3,""],
["حضور تمشيط",3,""],
["إعتقال عضو عصابة",5,""],
["إعتقال احد رؤساء العصابات",5,"ملاحظة"]

];

const activitiesBox =
document.getElementById("activities");

activitiesData.forEach(function(item,index){

const div =
document.createElement("div");

div.className="activity";

div.innerHTML =
'<div class="name">'+
(index+1)+". "+item[0]+
'</div>'+
'<div class="points">'+
"النقاط: ("+item[1]+")"+
(item[2] ? " — "+item[2] : "")+
'</div>'+
'<input class="activityInput" type="number" min="0" step="1" value="0" data-index="'+index+'" placeholder="اكتب عدد المرات">';

activitiesBox.appendChild(div);

});


/* ==========================================
   حساب النقاط
========================================== */

function calculate(){

let total=0;

document.querySelectorAll(".activityInput").forEach(function(input){

let number=parseInt(input.value,10);

if(isNaN(number) || number<0){
number=0;
}

const index=parseInt(input.dataset.index,10);

total += number * activitiesData[index][1];

});

document.getElementById("total").textContent =
total.toLocaleString("ar-SA");

return total;

}

document.querySelectorAll(".activityInput").forEach(function(input){

input.addEventListener("input",calculate);

});


/* ==========================================
   حفظ النقاط
========================================== */

document.getElementById("save").onclick =
function(){

const values=[];

document.querySelectorAll(".activityInput").forEach(function(input){
values.push(input.value);
});

localStorage.setItem(
"adelPointsData",
JSON.stringify(values)
);

alert("تم حفظ النقاط");

};


function loadPoints(){

const saved =
localStorage.getItem("adelPointsData");

if(saved){

try{

const values=JSON.parse(saved);

document.querySelectorAll(".activityInput").forEach(function(input,index){

if(values[index] !== undefined){
input.value=values[index];
}

});

}catch(e){}

}

calculate();

}


/* ==========================================
   إرسال طلب التسجيل
========================================== */

document.getElementById("sendRegister").onclick =
async function(){

const name =
document.getElementById("registerName").value.trim();

const unit =
document.getElementById("registerUnit").value.trim();

const msg =
document.getElementById("registerMsg");

if(!name){

msg.textContent="اكتب الاسم الثنائي";
return;

}

if(!unit){

msg.textContent="اكتب اليونت العسكري";
return;

}

const button =
document.getElementById("sendRegister");

button.disabled=true;
button.textContent="جاري الإرسال...";
msg.textContent="";

try{

const result =
await db
.from("registration_requests")
.insert({
full_name:name,
military_unit:unit,
access_code:null,
status:"pending"
});

if(result.error){

console.error(result.error);

msg.textContent="حدث خطأ أثناء إرسال الطلب";

return;

}

msg.textContent="تم إرسال طلب التسجيل بنجاح";

document.getElementById("registerName").value="";
document.getElementById("registerUnit").value="";

}catch(error){

console.error(error);

msg.textContent="تعذر الاتصال بقاعدة البيانات";

}finally{

button.disabled=false;
button.textContent="إرسال طلب التسجيل";

}

};


/* ==========================================
   تسجيل الدخول
========================================== */

document.getElementById("loginBtn").onclick =
async function(){

const name =
document.getElementById("loginName").value.trim();

const unit =
document.getElementById("loginUnit").value.trim();

const code =
document.getElementById("loginCode").value.trim();

const msg =
document.getElementById("loginMsg");

if(!name){

msg.textContent="اكتب الاسم الثنائي";
return;

}

if(!unit){

msg.textContent="اكتب اليونت العسكري";
return;

}

if(!code){

msg.textContent="اكتب الرمز الخاص";
return;

}

const button =
document.getElementById("loginBtn");

button.disabled=true;
button.textContent="جاري التحقق...";
msg.textContent="";

try{

const result =
await db.rpc(
"verify_login",
{
p_full_name:name,
p_military_unit:unit,
p_access_code:code
}
);

if(result.error){

console.error(result.error);

msg.textContent="حدث خطأ أثناء التحقق";

return;

}

if(
result.data &&
result.data.success === true
){

localStorage.setItem(
"adelLoggedIn",
"true"
);

localStorage.setItem(
"adelUserName",
name
);

localStorage.setItem(
"adelMilitaryUnit",
unit
);

document.getElementById("loginCode").value="";

page(appPage);

loadPoints();

}else{

msg.textContent=
"البيانات أو الرمز الخاص غير صحيح";

}

}catch(error){

console.error(error);

msg.textContent=
"تعذر الاتصال بقاعدة البيانات";

}finally{

button.disabled=false;
button.textContent="تسجيل الدخول";

}

};


/* ==========================================
   تسجيل الخروج
========================================== */

document.getElementById("logout").onclick =
function(){

localStorage.removeItem("adelLoggedIn");
localStorage.removeItem("adelUserName");
localStorage.removeItem("adelMilitaryUnit");

page(loginPage);

};


/* ==========================================
   حركة الجهاز
========================================== */

let motionStarted=false;

document.getElementById("motion").onclick =
async function(){

try{

if(
typeof DeviceOrientationEvent !== "undefined" &&
typeof DeviceOrientationEvent.requestPermission === "function"
){

const permission =
await DeviceOrientationEvent.requestPermission();

if(permission !== "granted"){

alert("لم يتم السماح بحركة الجهاز");
return;

}

}

if(motionStarted){
return;
}

window.addEventListener(
"deviceorientation",
function(event){

let value=Number(event.gamma)||0;

value=Math.max(-25,Math.min(25,value));

document.getElementById("credit").style.transform =
"rotate("+(value*0.8)+"deg)";

}
);

motionStarted=true;

alert("تم السماح بحركة الجهاز");

}catch(error){

console.error(error);

alert("تعذر تفعيل حركة الجهاز");

}

};


/* ==========================================
   البداية
========================================== */

calculate();

if(
localStorage.getItem("adelLoggedIn")==="true"
){

page(appPage);
loadPoints();

}else{

page(loginPage);

}

</script>

</body>
</html>
