<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تطبيق حسب النقاط</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f2f2f2;
      color: #111;
    }

    button,
    input {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #eeeeee, #dcdcdc);
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
      text-align: center;
    }

    .login-logo {
      width: 105px;
      height: 105px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .login-title {
      font-size: 30px;
      font-weight: bold;
      margin: 5px 0 8px;
    }

    .login-subtitle {
      color: #666;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 14px;
      text-align: right;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 15px;
    }

    .field input {
      width: 100%;
      height: 50px;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 17px;
      outline: none;
      background: #fafafa;
    }

    .field input:focus {
      border-color: #555;
      background: white;
    }

    .main-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 13px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .main-btn:active {
      transform: scale(.98);
    }

    .secondary-btn {
      width: 100%;
      height: 48px;
      border: 1px solid #aaa;
      border-radius: 13px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .message {
      min-height: 24px;
      margin-top: 14px;
      font-weight: bold;
      font-size: 14px;
    }

    /* REGISTER */

    #registerPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #eeeeee, #dcdcdc);
    }

    .register-box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
    }

    .register-title {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .register-info {
      text-align: center;
      color: #666;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    /* APP */

    #appPage {
      min-height: 100vh;
      background: #f3f3f3;
    }

    .header {
      min-height: 105px;
      background: white;
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid #ddd;
      gap: 10px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 17px;
    }

    .saudi-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .header-center {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .header-left {
      text-align: left;
      font-size: 17px;
      font-weight: bold;
    }

    .user-bar {
      background: #111;
      color: white;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-info {
      font-size: 15px;
    }

    .logout-btn {
      border: 1px solid #777;
      background: #222;
      color: white;
      border-radius: 9px;
      padding: 9px 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .content {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .total-box {
      background: white;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    .total-label {
      font-size: 17px;
      color: #555;
    }

    .total-number {
      font-size: 48px;
      font-weight: bold;
      margin-top: 4px;
    }

    .activities {
      display: grid;
      gap: 14px;
    }

    .activity {
      background: white;
      border-radius: 17px;
      padding: 17px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .activity-name {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    .activity-points {
      margin-top: 4px;
      color: #555;
      font-size: 14px;
    }

    .activity-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 13px;
    }

    .activity-row input {
      flex: 1;
      height: 48px;
      border: 1px solid #ccc;
      border-radius: 11px;
      padding: 0 13px;
      font-size: 18px;
      text-align: center;
      background: #fafafa;
    }

    .activity-result {
      min-width: 95px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }

    .bottom-actions {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .save-btn {
      height: 52px;
      border: none;
      border-radius: 13px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .clear-btn {
      height: 48px;
      border: 1px solid #aaa;
      border-radius: 13px;
      background: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .design-credit {
      text-align: center;
      margin: 28px 0 15px;
      color: #555;
      font-weight: bold;
      user-select: none;
    }

    @media (max-width: 650px) {
      .header {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .header-right,
      .header-left {
        justify-content: center;
        text-align: center;
      }

      .header-center {
        order: -1;
      }

      .activity-row {
        flex-wrap: wrap;
      }

      .activity-row input {
        min-width: 100%;
      }

      .activity-result {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginPage">

  <div class="login-box">

    <img
      class="login-logo"
      src="https://upload.wikimedia.org/wikipedia/commons/9/99/Emblem_of_Saudi_Arabia.svg"
      alt="شعار المملكة العربية السعودية"
    >

    <div class="login-title">تسجيل الدخول</div>

    <div class="login-subtitle">
      تطبيق حسب النقاط
    </div>

    <div class="field">
      <label for="loginName">الاسم الثنائي</label>
      <input
        id="loginName"
        type="text"
        placeholder="اكتب الاسم الثنائي"
        autocomplete="off"
      >
    </div>

    <div class="field">
      <label for="loginUnit">اليونت العسكري</label>
      <input
        id="loginUnit"
        type="text"
        placeholder="اكتب اليونت العسكري"
        autocomplete="off"
      >
    </div>

    <div class="field">
      <label for="loginCode">الرمز الخاص</label>
      <input
        id="loginCode"
        type="password"
        placeholder="اكتب الرمز الخاص"
        autocomplete="off"
      >
    </div>

    <button
      class="main-btn"
      id="loginBtn"
      type="button"
    >
      تسجيل الدخول
    </button>

    <button
      class="secondary-btn"
      id="openRegisterBtn"
      type="button"
    >
      طلب تسجيل جديد
    </button>

    <div
      id="loginMessage"
      class="message"
      aria-live="polite"
    ></div>

  </div>

</section>


<!-- ================= REGISTER ================= -->

<section id="registerPage" class="hidden">

  <div class="register-box">

    <div class="register-title">
      طلب تسجيل جديد
    </div>

    <div class="register-info">
      اكتب بياناتك وسيتم إرسال طلب التسجيل.<br>
      بعد الموافقة تحصل على الرمز الخاص للدخول.
    </div>

    <div class="field">
      <label for="registerName">الاسم الثنائي</label>
      <input
        id="registerName"
        type="text"
        placeholder="اكتب الاسم الثنائي"
        autocomplete="off"
      >
    </div>

    <div class="field">
      <label for="registerUnit">اليونت العسكري</label>
      <input
        id="registerUnit"
        type="text"
        placeholder="اكتب اليونت العسكري"
        autocomplete="off"
      >
    </div>

    <button
      class="main-btn"
      id="registerBtn"
      type="button"
    >
      إرسال طلب التسجيل
    </button>

    <button
      class="secondary-btn"
      id="backLoginBtn"
      type="button"
    >
      العودة لتسجيل الدخول
    </button>

    <div
      id="registerMessage"
      class="message"
      aria-live="polite"
    ></div>

  </div>

</section>


<!-- ================= APP ================= -->

<section id="appPage" class="hidden">

  <header class="header">

    <div class="header-right">
      <img
        class="saudi-logo"
        src="https://upload.wikimedia.org/wikipedia/commons/9/99/Emblem_of_Saudi_Arabia.svg"
        alt="شعار السعودية"
      >
      <span>وزارة الداخلية</span>
    </div>

    <div class="header-center">
      تطبيق حسب النقاط
    </div>

    <div class="header-left">
      KR
    </div>

  </header>

  <div class="user-bar">

    <div
      id="loggedUser"
      class="user-info"
    ></div>

    <button
      id="logoutBtn"
      class="logout-btn"
      type="button"
    >
      تسجيل الخروج
    </button>

  </div>

  <main class="content">

    <div class="total-box">

      <div class="total-label">
        مجموع النقاط
      </div>

      <div
        id="totalPoints"
        class="total-number"
      >
        0
      </div>

    </div>

    <div
      id="activities"
      class="activities"
    ></div>

    <div class="bottom-actions">

      <button
        id="saveBtn"
        class="save-btn"
        type="button"
      >
        حفظ النقاط
      </button>

      <button
        id="clearBtn"
        class="clear-btn"
        type="button"
      >
        حذف جميع النقاط
      </button>

    </div>

    <div
      id="designCredit"
      class="design-credit"
    >
      تصميم: عادل الشمري
    </div>

  </main>

</section>


<script>

  /* =========================================================
     SUPABASE
     ========================================================= */

  const SUPABASE_URL =
    "https://rvgvqooateniymiypraz.supabase.co";

  /*
    مهم جداً:
    استبدل النص الموجود بين علامات التنصيص
    بالـ Publishable key الخاص بمشروعك في Supabase.
  */

  const SUPABASE_KEY =
    "ضع_هنا_Publishable_Key_الخاص_بمشروعك";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     ACTIVITIES
     ========================================================= */

  const activities = [

    {
      id: 1,
      name: "تدشين نقطة تفتيش متحركة",
      points: 1,
      note: "كل ١/٢ ساعة"
    },

    {
      id: 2,
      name: "إستيقاف مروري",
      points: 1,
      note: ""
    },

    {
      id: 3,
      name: "تسجيل مخالفة",
      points: 1,
      note: ""
    },

    {
      id: 4,
      name: "حضور حملة أمنية (عامة)",
      points: 2,
      note: ""
    },

    {
      id: 5,
      name: "حضور حملة أمنية (خاصة)",
      points: 2,
      note: ""
    },

    {
      id: 6,
      name: "حضور تدريب (عام-خاص)",
      points: 2,
      note: ""
    },

    {
      id: 7,
      name: "إسقاط رجل عصابة",
      points: 3,
      note: ""
    },

    {
      id: 8,
      name: "حضور تمشيط",
      points: 3,
      note: ""
    },

    {
      id: 9,
      name: "إعتقال عضو عصابة",
      points: 5,
      note: ""
    },

    {
      id: 10,
      name: "إعتقال احد رؤساء العصابات",
      points: 5,
      note: "ملاحظة"
    }

  ];


  /* =========================================================
     ELEMENTS
     ========================================================= */

  const loginPage =
    document.getElementById("loginPage");

  const registerPage =
    document.getElementById("registerPage");

  const appPage =
    document.getElementById("appPage");

  const loginName =
    document.getElementById("loginName");

  const loginUnit =
    document.getElementById("loginUnit");

  const loginCode =
    document.getElementById("loginCode");

  const loginBtn =
    document.getElementById("loginBtn");

  const loginMessage =
    document.getElementById("loginMessage");

  const registerName =
    document.getElementById("registerName");

  const registerUnit =
    document.getElementById("registerUnit");

  const registerBtn =
    document.getElementById("registerBtn");

  const registerMessage =
    document.getElementById("registerMessage");

  const activitiesContainer =
    document.getElementById("activities");

  const totalPoints =
    document.getElementById("totalPoints");

  const loggedUser =
    document.getElementById("loggedUser");


  /* =========================================================
     LOCAL STORAGE
     ========================================================= */

  const POINTS_KEY =
    "adelPointsData";

  const USER_KEY =
    "adelLoggedUser";


  /* =========================================================
     HELPERS
     ========================================================= */

  function cleanText(value) {

    return String(value || "")
      .trim()
      .replace(/\s+/g, " ");

  }


  function showLogin() {

    loginPage.classList.remove("hidden");
    registerPage.classList.add("hidden");
    appPage.classList.add("hidden");

  }


  function showRegister() {

    loginPage.classList.add("hidden");
    registerPage.classList.remove("hidden");
    appPage.classList.add("hidden");

    registerMessage.textContent = "";

  }


  function showApp(user) {

    loginPage.classList.add("hidden");
    registerPage.classList.add("hidden");
    appPage.classList.remove("hidden");

    loggedUser.textContent =
      "المستخدم: " +
      user.full_name +
      " — " +
      user.military_unit;

    loadActivities();

  }


  function saveLoggedUser(user) {

    localStorage.setItem(
      USER_KEY,
      JSON.stringify(user)
    );

  }


  function getLoggedUser() {

    try {

      const value =
        localStorage.getItem(USER_KEY);

      if (!value) return null;

      return JSON.parse(value);

    } catch (error) {

      return null;

    }

  }


  /* =========================================================
     ACTIVITIES UI
     ========================================================= */

  function renderActivities() {

    activitiesContainer.innerHTML = "";

    activities.forEach(activity => {

      const box =
        document.createElement("div");

      box.className = "activity";

      box.innerHTML = `

        <div class="activity-name">
          ${activity.name}
        </div>

        <div class="activity-points">
          (${activity.points}) نقطة
          ${activity.note
            ? " — " + activity.note
            : ""}
        </div>

        <div class="activity-row">

          <input
            class="activity-input"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            data-id="${activity.id}"
            placeholder="عدد المرات"
          >

          <div
            class="activity-result"
            id="result-${activity.id}"
          >
            0 نقطة
          </div>

        </div>

      `;

      activitiesContainer.appendChild(box);

    });


    document
      .querySelectorAll(".activity-input")
      .forEach(input => {

        input.addEventListener(
          "input",
          updateTotal
        );

      });

  }


  function updateTotal() {

    let total = 0;

    document
      .querySelectorAll(".activity-input")
      .forEach(input => {

        let count =
          parseInt(input.value, 10);

        if (!Number.isFinite(count) || count < 0) {
          count = 0;
        }

        const id =
          Number(input.dataset.id);

        const activity =
          activities.find(item => item.id === id);

        const points =
          count * activity.points;

        const result =
          document.getElementById(
            "result-" + id
          );

        if (result) {

          result.textContent =
            points + " نقطة";

        }

        total += points;

      });


    totalPoints.textContent =
      total.toLocaleString("ar-SA");

  }


  function loadActivities() {

    renderActivities();

    try {

      const saved =
        localStorage.getItem(POINTS_KEY);

      if (!saved) {

        updateTotal();
        return;

      }

      const data =
        JSON.parse(saved);

      document
        .querySelectorAll(".activity-input")
        .forEach(input => {

          const id =
            Number(input.dataset.id);

          if (
            data &&
            Object.prototype.hasOwnProperty.call(
              data,
              id
            )
          ) {

            input.value = data[id];

          }

        });

    } catch (error) {

      console.log(error);

    }

    updateTotal();

  }


  /* =========================================================
     SAVE POINTS
     ========================================================= */

  document
    .getElementById("saveBtn")
    .addEventListener("click", () => {

      const data = {};

      document
        .querySelectorAll(".activity-input")
        .forEach(input => {

          let count =
            parseInt(input.value, 10);

          if (!Number.isFinite(count) || count < 0) {
            count = 0;
          }

          data[input.dataset.id] =
            count;

        });


      localStorage.setItem(
        POINTS_KEY,
        JSON.stringify(data)
      );


      alert("تم حفظ النقاط بنجاح");

    });


  /* =========================================================
     CLEAR POINTS
     ========================================================= */

  document
    .getElementById("clearBtn")
    .addEventListener("click", () => {

      const confirmed =
        confirm(
          "هل أنت متأكد من حذف جميع النقاط؟"
        );

      if (!confirmed) return;

      localStorage.removeItem(
        POINTS_KEY
      );

      document
        .querySelectorAll(".activity-input")
        .forEach(input => {

          input.value = "";

        });

      updateTotal();

    });


  /* =========================================================
     REGISTER
     ========================================================= */

  document
    .getElementById("openRegisterBtn")
    .addEventListener(
      "click",
      showRegister
    );


  document
    .getElementById("backLoginBtn")
    .addEventListener(
      "click",
      showLogin
    );


  registerBtn.addEventListener(
    "click",
    async () => {

      registerMessage.textContent = "";

      const fullName =
        cleanText(registerName.value);

      const militaryUnit =
        cleanText(registerUnit.value);


      if (!fullName || !militaryUnit) {

        registerMessage.textContent =
          "عبي الاسم الثنائي واليونت العسكري.";

        return;

      }


      if (fullName.length < 3) {

        registerMessage.textContent =
          "اكتب الاسم بشكل صحيح.";

        return;

      }


      registerBtn.disabled = true;
      registerBtn.textContent =
        "جاري إرسال الطلب...";


      try {

        const { error } =
          await supabaseClient
            .from("registration_requests")
            .insert([
              {
                full_name: fullName,
                military_unit: militaryUnit,
                access_code: null,
                status: "pending"
              }
            ]);


        if (error) {

          console.error(error);

          registerMessage.textContent =
            "تعذر إرسال الطلب، تأكد من إعداد Supabase.";

          return;

        }


        registerName.value = "";
        registerUnit.value = "";

        registerMessage.textContent =
          "تم إرسال طلب التسجيل. انتظر الموافقة والرمز الخاص.";

      } catch (error) {

        console.error(error);

        registerMessage.textContent =
          "حدث خطأ أثناء إرسال الطلب.";

      } finally {

        registerBtn.disabled = false;

        registerBtn.textContent =
          "إرسال طلب التسجيل";

      }

    }
  );


  /* =========================================================
     LOGIN
     ========================================================= */

  loginBtn.addEventListener(
    "click",
    async () => {

      loginMessage.textContent = "";

      const fullName =
        cleanText(loginName.value);

      const militaryUnit =
        cleanText(loginUnit.value);

      const accessCode =
        cleanText(loginCode.value);


      if (
        !fullName ||
        !militaryUnit ||
        !accessCode
      ) {

        loginMessage.textContent =
          "عبي جميع البيانات.";

        return;

      }


      loginBtn.disabled = true;
      loginBtn.textContent =
        "جاري التحقق...";


      try {

        const { data, error } =
          await supabaseClient
            .rpc(
              "verify_login",
              {
                p_full_name: fullName,
                p_military_unit: militaryUnit,
                p_access_code: accessCode
              }
            );


        if (error) {

          console.error(error);

          loginMessage.textContent =
            "تعذر التحقق من البيانات.";

          return;

        }


        if (
          !data ||
          data.success !== true
        ) {

          loginMessage.textContent =
            "البيانات أو الرمز الخاص غير صحيح.";

          return;

        }


        const user = {

          full_name:
            data.full_name,

          military_unit:
            data.military_unit

        };


        saveLoggedUser(user);

        showApp(user);


        loginName.value = "";
        loginUnit.value = "";
        loginCode.value = "";

      } catch (error) {

        console.error(error);

        loginMessage.textContent =
          "حدث خطأ أثناء تسجيل الدخول.";

      } finally {

        loginBtn.disabled = false;

        loginBtn.textContent =
          "تسجيل الدخول";

      }

    }
  );


  /* =========================================================
     LOGOUT
     ========================================================= */

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      () => {

        localStorage.removeItem(
          USER_KEY
        );

        showLogin();

      }
    );


  /* =========================================================
     DEVICE MOTION
     ========================================================= */

  let motionHandler = null;

  function setupMotion() {

    const credit =
      document.getElementById(
        "designCredit"
      );

    if (!credit) return;


    motionHandler = event => {

      const gamma =
        Number(event.gamma || 0);

      const beta =
        Number(event.beta || 0);

      const x =
        Math.max(
          -18,
          Math.min(18, gamma)
        );

      const y =
        Math.max(
          -18,
          Math.min(18, beta)
        );


      credit.style.transform =
        "translate(" +
        (x * 0.5) +
        "px," +
        (y * 0.15) +
        "px)";

    };


    window.addEventListener(
      "deviceorientation",
      motionHandler
    );

  }


  /* =========================================================
     START
     ========================================================= */

  setupMotion();

  const existingUser =
    getLoggedUser();

  if (existingUser) {

    showApp(existingUser);

  } else {

    showLogin();

  }

</script>

</body>
</html>
