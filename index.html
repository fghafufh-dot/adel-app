<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تطبيق حسب النقاط</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f4f4;
  color:#111;
}

button,
input{
  font-family:inherit;
}

.page{
  display:none;
  min-height:100vh;
  padding:20px;
}

.page.active{
  display:block;
}

/* تسجيل الدخول */

.login-box{
  max-width:430px;
  margin:70px auto;
  background:white;
  padding:28px;
  border-radius:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.12);
}

.login-title{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:8px;
}

.app-name{
  text-align:center;
  font-size:19px;
  margin-bottom:28px;
  color:#444;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #bbb;
  border-radius:10px;
  font-size:16px;
  outline:none;
  background:#fff;
}

input:focus{
  border-color:#333;
}

.main-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  margin-top:20px;
  font-size:17px;
  font-weight:bold;
  background:#111;
  color:white;
  cursor:pointer;
}

.secondary-btn{
  width:100%;
  border:1px solid #222;
  border-radius:10px;
  padding:13px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  background:white;
  color:#111;
  cursor:pointer;
}

.message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
  min-height:24px;
}

/* التطبيق */

.app-header{
  background:#111;
  color:white;
  border-radius:15px;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:20px;
}

.header-side{
  flex:1;
  display:flex;
  align-items:center;
  gap:8px;
}

.header-center{
  flex:1;
  text-align:center;
  font-size:21px;
  font-weight:bold;
}

.header-left{
  justify-content:flex-start;
}

.header-right{
  justify-content:flex-end;
}

.emblem{
  width:48px;
  height:48px;
  object-fit:contain;
  background:white;
  border-radius:50%;
}

.activities{
  max-width:850px;
  margin:auto;
}

.activity{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.activity-name{
  font-size:17px;
  font-weight:bold;
  margin-bottom:7px;
}

.points{
  font-size:14px;
  color:#555;
  margin-bottom:10px;
}

.activity input{
  width:100%;
}

.total-box{
  background:#111;
  color:white;
  border-radius:15px;
  padding:20px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  margin-top:20px;
}

.action-row{
  max-width:850px;
  margin:15px auto;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.action-row button{
  flex:1;
  min-width:170px;
  padding:13px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.save{
  background:#111;
  color:white;
}

.motion{
  background:#ddd;
  color:#111;
}

.logout{
  background:#b00020;
  color:white;
}

.credit{
  position:fixed;
  bottom:15px;
  right:15px;
  font-size:14px;
  font-weight:bold;
  transition:transform .2s;
}

@media(max-width:650px){

  .app-header{
    flex-direction:column;
  }

  .header-side{
    width:100%;
    justify-content:center;
  }

  .header-center{
    order:-1;
  }

  .login-box{
    margin:30px auto;
  }
}
</style>
</head>

<body>

<!-- =========================
     صفحة تسجيل الدخول
========================= -->

<section id="loginPage" class="page active">

  <div class="login-box">

    <div class="login-title">
      تسجيل الدخول
    </div>

    <div class="app-name">
      تطبيق حسب النقاط
    </div>

    <label for="loginName">
      الاسم الثنائي
    </label>

    <input
      id="loginName"
      type="text"
      placeholder="اكتب الاسم الثنائي"
      autocomplete="off"
    >

    <label for="loginUnit">
      اليونت العسكري
    </label>

    <input
      id="loginUnit"
      type="text"
      placeholder="اكتب اليونت العسكري"
      autocomplete="off"
    >

    <label for="loginCode">
      الرمز الخاص
    </label>

    <input
      id="loginCode"
      type="password"
      placeholder="اكتب الرمز الخاص"
      autocomplete="off"
    >

    <button
      id="loginBtn"
      class="main-btn"
      type="button"
    >
      تسجيل الدخول
    </button>

    <button
      id="openRegisterBtn"
      class="secondary-btn"
      type="button"
    >
      طلب تسجيل جديد
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>

</section>


<!-- =========================
     صفحة طلب التسجيل
========================= -->

<section id="registerPage" class="page">

  <div class="login-box">

    <div class="login-title">
      طلب تسجيل جديد
    </div>

    <div class="app-name">
      تطبيق حسب النقاط
    </div>

    <label for="registerName">
      الاسم الثنائي
    </label>

    <input
      id="registerName"
      type="text"
      placeholder="اكتب الاسم الثنائي"
      autocomplete="off"
    >

    <label for="registerUnit">
      اليونت العسكري
    </label>

    <input
      id="registerUnit"
      type="text"
      placeholder="اكتب اليونت العسكري"
      autocomplete="off"
    >

    <button
      id="registerBtn"
      class="main-btn"
      type="button"
    >
      إرسال طلب التسجيل
    </button>

    <button
      id="backLoginBtn"
      class="secondary-btn"
      type="button"
    >
      العودة لتسجيل الدخول
    </button>

    <div
      id="registerMessage"
      class="message"
    ></div>

  </div>

</section>


<!-- =========================
     صفحة التطبيق
========================= -->

<section id="appPage" class="page">

  <div class="app-header">

    <div class="header-side header-right">

      <div>
        وزارة الداخلية
      </div>

      <img
        class="emblem"
        src="https://upload.wikimedia.org/wikipedia/commons/9/99/Emblem_of_Saudi_Arabia.svg"
        alt="شعار المملكة العربية السعودية"
      >

    </div>

    <div class="header-center">
      تطبيق حسب النقاط
    </div>

    <div class="header-side header-left">
      KR
    </div>

  </div>


  <div id="activitiesContainer" class="activities"></div>


  <div class="total-box">
    المجموع:
    <span id="totalPoints">0</span>
  </div>


  <div class="action-row">

    <button
      id="saveBtn"
      class="save"
      type="button"
    >
      حفظ النقاط
    </button>

    <button
      id="motionBtn"
      class="motion"
      type="button"
    >
      السماح بحركة الجهاز
    </button>

    <button
      id="logoutBtn"
      class="logout"
      type="button"
    >
      تسجيل الخروج
    </button>

  </div>

</section>


<div
  id="credit"
  class="credit"
>
  تصميم: عادل الشمري
</div>


<script>

/* =========================================
   إعداد Supabase
========================================= */

const SUPABASE_URL =
  "https://rvgvqooateniymiypraz.supabase.co";


/*
  الصق Publishable Key الخاص بك هنا.
  لا تضع Secret Key أو Service Role.
*/

const SUPABASE_KEY =
 "Settings

CONFIGURATION
昭
General
I
国
Security
SSO

CONNECTIONS
OAuth Apps

COMPLIANCE
Audit Logs
Audit Log Drains
Legal Documents
Organizat
Unable to copy to clipboard
General configuration, privacy, and lifecycle controls
Organization details
Organization name
fghafufh-dot's Org
Organization slug
/mzgduovljfpogiwt
Copy
Cancel
Save
Data privacy
Supabase Assistant Opt-in
Level
Supabase Al can provide more relevant answers if you choose to share different levels of data. This feature is powered by third-party Al providers. This is an
organization-wide setting, so please select the level of data you are comfortable sharing.
For organizations with HIPAA compliance enabled in their Supabase configuration, any consented information will only be shared with third-party Al providers with whom Supabase has established a Business Associate
Agreement (BAA). Don't input personal data unless you've obtained consent from the individuals it relates to.
• Disabled
You do not consent to sharing any database information with third-party Al providers and understand that responses will be generic and not tailored to your database

You consent to sharing your database's schema metadata (such as table and column names, data types, and relationships-but not actual database data) with third-party Al providers
Schema & Logs
You consent to sharing your schema and logs (which may contain PIl/database data) with third-party Al providers for better results
Schema, Logs & Database";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   الصفحات
========================================= */

const loginPage =
  document.getElementById("loginPage");

const registerPage =
  document.getElementById("registerPage");

const appPage =
  document.getElementById("appPage");


function showPage(page){

  loginPage.classList.remove("active");
  registerPage.classList.remove("active");
  appPage.classList.remove("active");

  page.classList.add("active");
}


/* =========================================
   الأنشطة
========================================= */

const activities = [

  {
    name:"تدشين نقطة تفتيش متحركة",
    points:1,
    note:"كل ١/٢ ساعة"
  },

  {
    name:"إستيقاف مروري",
    points:1,
    note:""
  },

  {
    name:"تسجيل مخالفة",
    points:1,
    note:""
  },

  {
    name:"حضور حملة أمنية (عامة)",
    points:2,
    note:""
  },

  {
    name:"حضور حملة أمنية (خاصة)",
    points:2,
    note:""
  },

  {
    name:"حضور تدريب (عام-خاص)",
    points:2,
    note:""
  },

  {
    name:"إسقاط رجل عصابة",
    points:3,
    note:""
  },

  {
    name:"حضور تمشيط",
    points:3,
    note:""
  },

  {
    name:"إعتقال عضو عصابة",
    points:5,
    note:""
  },

  {
    name:"إعتقال احد رؤساء العصابات",
    points:5,
    note:"ملاحظة"
  }

];


/* =========================================
   بناء الأنشطة
========================================= */

const activitiesContainer =
  document.getElementById("activitiesContainer");


activities.forEach((activity,index)=>{

  const box =
    document.createElement("div");

  box.className =
    "activity";


  const note =
    activity.note
      ? ` — ${activity.note}`
      : "";


  box.innerHTML = `

    <div class="activity-name">
      ${index + 1}. ${activity.name}
    </div>

    <div class="points">
      النقاط: (${activity.points})${note}
    </div>

    <input
      class="activity-input"
      type="number"
      min="0"
      step="1"
      value="0"
      data-index="${index}"
      placeholder="اكتب عدد المرات"
    >

  `;


  activitiesContainer.appendChild(box);

});


/* =========================================
   حساب المجموع
========================================= */

const totalPoints =
  document.getElementById("totalPoints");


function calculateTotal(){

  let total = 0;


  document
    .querySelectorAll(".activity-input")
    .forEach(input=>{

      let number =
        parseInt(input.value,10);

      if(
        Number.isNaN(number) ||
        number < 0
      ){

        number = 0;

      }


      const index =
        parseInt(
          input.dataset.index,
          10
        );


      total +=
        number *
        activities[index].points;

    });


  totalPoints.textContent =
    total.toLocaleString("ar-SA");

  return total;
}


document
  .querySelectorAll(".activity-input")
  .forEach(input=>{

    input.addEventListener(
      "input",
      calculateTotal
    );

  });


/* =========================================
   حفظ النقاط محليًا
========================================= */

const STORAGE_KEY =
  "adelPointsData";


function savePoints(){

  const values = [];


  document
    .querySelectorAll(".activity-input")
    .forEach(input=>{

      values.push(
        input.value || "0"
      );

    });


  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(values)
  );


  alert("تم حفظ النقاط");


}


function loadPoints(){

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );


  if(!saved){
    calculateTotal();
    return;
  }


  try{

    const values =
      JSON.parse(saved);


    document
      .querySelectorAll(".activity-input")
      .forEach((input,index)=>{

        if(
          values[index] !== undefined
        ){

          input.value =
            values[index];

        }

      });

  }catch(error){

    console.log(error);

  }


  calculateTotal();

}


document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    savePoints
  );


/* =========================================
   طلب تسجيل جديد
========================================= */

document
  .getElementById("openRegisterBtn")
  .addEventListener(
    "click",
    ()=>{

      document.getElementById(
        "registerName"
      ).value = "";

      document.getElementById(
        "registerUnit"
      ).value = "";

      document.getElementById(
        "registerMessage"
      ).textContent = "";

      showPage(registerPage);

    }
  );


/* العودة لتسجيل الدخول */

document
  .getElementById("backLoginBtn")
  .addEventListener(
    "click",
    ()=>{

      document.getElementById(
        "registerMessage"
      ).textContent = "";

      showPage(loginPage);

    }
  );


/* =========================================
   إرسال طلب التسجيل إلى Supabase
========================================= */

document
  .getElementById("registerBtn")
  .addEventListener(
    "click",
    async ()=>{

      const name =
        document
          .getElementById(
            "registerName"
          )
          .value
          .trim();


      const unit =
        document
          .getElementById(
            "registerUnit"
          )
          .value
          .trim();


      const message =
        document.getElementById(
          "registerMessage"
        );


      message.textContent = "";


      if(!name){

        message.textContent =
          "اكتب الاسم الثنائي";

        return;

      }


      if(!unit){

        message.textContent =
          "اكتب اليونت العسكري";

        return;

      }


      const button =
        document.getElementById(
          "registerBtn"
        );


      button.disabled = true;

      button.textContent =
        "جاري إرسال الطلب...";


      try{

        const { error } =
          await supabaseClient
            .from(
              "registration_requests"
            )
            .insert([
              {
                full_name:name,
                military_unit:unit,
                access_code:null,
                status:"pending"
              }
            ]);


        if(error){

          console.error(error);

          message.textContent =
            "حدث خطأ أثناء إرسال الطلب";

          return;

        }


        message.textContent =
          "تم إرسال طلب التسجيل بنجاح";


        document.getElementById(
          "registerName"
        ).value = "";


        document.getElementById(
          "registerUnit"
        ).value = "";


      }catch(error){

        console.error(error);

        message.textContent =
          "تعذر الاتصال بقاعدة البيانات";

      }finally{

        button.disabled = false;

        button.textContent =
          "إرسال طلب التسجيل";

      }

    }
  );


/* =========================================
   تسجيل الدخول
========================================= */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    async ()=>{

      const name =
        document
          .getElementById(
            "loginName"
          )
          .value
          .trim();


      const unit =
        document
          .getElementById(
            "loginUnit"
          )
          .value
          .trim();


      const code =
        document
          .getElementById(
            "loginCode"
          )
          .value
          .trim();


      const message =
        document.getElementById(
          "loginMessage"
        );


      message.textContent = "";


      if(!name){

        message.textContent =
          "اكتب الاسم الثنائي";

        return;

      }


      if(!unit){

        message.textContent =
          "اكتب اليونت العسكري";

        return;

      }


      if(!code){

        message.textContent =
          "اكتب الرمز الخاص";

        return;

      }


      const button =
        document.getElementById(
          "loginBtn"
        );


      button.disabled = true;

      button.textContent =
        "جاري التحقق...";


      try{

        const { data,error } =
          await supabaseClient.rpc(
            "verify_login",
            {
              p_full_name:name,
              p_military_unit:unit,
              p_access_code:code
            }
          );


        if(error){

          console.error(error);

          message.textContent =
            "حدث خطأ أثناء التحقق";

          return;

        }


        if(
          data &&
          data.success === true
        ){

          localStorage.setItem(
            "adelLoggedIn",
            "true"
          );


          localStorage.setItem(
            "adelUserName",
            name
          );


          localStorage.setItem(
            "adelMilitaryUnit",
            unit
          );


          message.textContent =
            "";


          document.getElementById(
            "loginCode"
          ).value = "";


          showPage(appPage);

          loadPoints();


        }else{

          message.textContent =
            "البيانات أو الرمز الخاص غير صحيح";

        }


      }catch(error){

        console.error(error);

        message.textContent =
          "تعذر الاتصال بقاعدة البيانات";

      }finally{

        button.disabled = false;

        button.textContent =
          "تسجيل الدخول";

      }

    }
  );


/* =========================================
   تسجيل الخروج
========================================= */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    ()=>{

      localStorage.removeItem(
        "adelLoggedIn"
      );

      localStorage.removeItem(
        "adelUserName"
      );

      localStorage.removeItem(
        "adelMilitaryUnit"
      );


      document.getElementById(
        "loginName"
      ).value = "";

      document.getElementById(
        "loginUnit"
      ).value = "";

      document.getElementById(
        "loginCode"
      ).value = "";


      showPage(loginPage);

    }
  );


/* =========================================
   حركة الجهاز
========================================= */

const credit =
  document.getElementById(
    "credit"
  );


let motionEnabled = false;


document
  .getElementById("motionBtn")
  .addEventListener(
    "click",
    async ()=>{

      try{

        if(
          typeof DeviceOrientationEvent !==
          "undefined" &&
          typeof DeviceOrientationEvent.requestPermission ===
          "function"
        ){

          const permission =
            await DeviceOrientationEvent.requestPermission();


          if(
            permission !== "granted"
          ){

            alert(
              "لم يتم السماح بحركة الجهاز"
            );

            return;

          }

        }


        if(!motionEnabled){

          window.addEventListener(
            "deviceorientation",
            handleOrientation
          );

          motionEnabled = true;

          alert(
            "تم السماح بحركة الجهاز"
          );

        }

      }catch(error){

        console.error(error);

        alert(
          "تعذر تفعيل حركة الجهاز"
        );

      }

    }
  );


function handleOrientation(event){

  const gamma =
    Number(event.gamma) || 0;


  const limited =
    Math.max(
      -25,
      Math.min(
        25,
        gamma
      )
    );


  credit.style.transform =
    `rotate(${limited * 0.8}deg)`;

}


/* =========================================
   تشغيل التطبيق
========================================= */

if(
  localStorage.getItem(
    "adelLoggedIn"
  ) === "true"
){

  showPage(appPage);

  loadPoints();

}else{

  showPage(loginPage);

}


calculateTotal();

</script>

</body>
</html>
