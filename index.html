<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حساب النقاط</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }
    .container {
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }
    h1, h2 {
      text-align: center;
    }
    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      border: 1px solid #d1d5db;
    }
    button {
      border: none;
      background: #111827;
      color: white;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    .total {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin: 15px 0;
    }
    .activity {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      background: #fafafa;
    }
    .activity-name {
      font-weight: bold;
      font-size: 18px;
    }
    .activity-points {
      margin-top: 5px;
      font-weight: bold;
    }
    .designer {
      text-align: center;
      color: #6b7280;
      font-weight: bold;
      margin-top: 25px;
      padding-bottom: 15px;
    }
    .empty {
      text-align: center;
      color: #6b7280;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>حساب النقاط</h1>
    <input
      id="userName"
      type="text"
      placeholder="اسم المستخدم"
    >
    <input
      id="activityName"
      type="text"
      placeholder="اسم النشاط"
    >
    <input
      id="activityPoints"
      type="number"
      placeholder="عدد النقاط"
      min="0"
    >
    <button onclick="addActivity()">
      إضافة النشاط
    </button>
  </div>
  <div class="card">
    <h2>مجموع النقاط</h2>
    <div class="total" id="totalPoints">
      0
    </div>
  </div>
  <div class="card">
    <h2>الأنشطة</h2>
    <div id="activitiesList">
      <p class="empty">
        لا توجد أنشطة حتى الآن
      </p>
    </div>
  </div>
  <div class="designer">
    المصمم: عادل الشمري
  </div>
</div>
<script>
  let activities = [];
  function addActivity() {
    const userName =
      document.getElementById("userName")
        .value.trim();
    const activityName =
      document.getElementById("activityName")
        .value.trim();
    const points =
      Number(
        document.getElementById("activityPoints")
          .value
      );
    if (!userName) {
      alert("اكتب اسم المستخدم");
      return;
    }
    if (!activityName) {
      alert("اكتب اسم النشاط");
      return;
    }
    if (!points || points < 0) {
      alert("اكتب عدد النقاط");
      return;
    }
    activities.push({
      userName: userName,
      activityName: activityName,
      points: points
    });
    document.getElementById("activityName").value = "";
    document.getElementById("activityPoints").value = "";
    updateScreen();
  }
  function updateScreen() {
    const list =
      document.getElementById("activitiesList");
    if (activities.length === 0) {
      list.innerHTML =
        '<p class="empty">لا توجد أنشطة حتى الآن</p>';
      document.getElementById("totalPoints")
        .textContent = "0";
      return;
    }
    let total = 0;
    list.innerHTML =
      activities.map(function(activity) {
        total += activity.points;
        return `
          <div class="activity">
            <div class="activity-name">
              ${escapeHtml(activity.activityName)}
            </div>
            <div>
              المستخدم:
              ${escapeHtml(activity.userName)}
            </div>
            <div class="activity-points">
              النقاط: ${activity.points}
            </div>
          </div>
        `;
      }).join("");
    document.getElementById("totalPoints")
      .textContent = total;
  }
  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
</script>
</body>
</html>
