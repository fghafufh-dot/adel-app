<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تطبيق حسب النقاط</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f3f3f3;
  font-family: Arial, sans-serif;
  color: #111;
}

.container {
  width: 95%;
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

/* =========================
   الرأس
========================= */

.header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  background: white;
  border-radius: 15px;
  padding: 12px 15px;
  margin-bottom: 18px;
  box-shadow: 0 3px 10px rgba(0,0,0,.12);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: flex-start;
  font-size: 18px;
  font-weight: bold;
}

.header-left {
  text-align: right;
  font-size: 20px;
  font-weight: bold;
}

.header-center {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

/* شعار السعودية */

.saudi-logo {
  width: 70px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.saudi-logo img {
  width: 70px;
  height: 70px;
  display: block;
  object-fit: contain;
}

/* =========================
   الأعمال
========================= */

.activity {
  background: white;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.10);
}

.activity-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 7px;
}

.activity-points {
  font-size: 15px;
  color: #555;
  margin-bottom: 10px;
}

.activity-input {
  width: 100%;
  height: 45px;
  border: 1px solid #aaa;
  border-radius: 9px;
  padding: 8px 12px;
  font-size: 17px;
  text-align: center;
  outline: none;
}

.activity-input:focus {
  border-color: #111;
}

/* =========================
   المجموع
========================= */

.total-box {
  background: #111;
  color: white;
  border-radius: 14px;
  padding: 18px;
  text-align: center;
  margin-top: 18px;
  font-size: 23px;
  font-weight: bold;
}

/* =========================
   الأزرار
========================= */

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 18px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  flex: 1;
  min-width: 150px;
}

.save-btn {
  background: #111;
  color: white;
}

.delete-btn {
  background: #c62828;
  color: white;
}

.motion-btn {
  background: #ddd;
  color: #111;
}

/* =========================
   التصميم
========================= */

.design-credit {
  position: fixed;
  bottom: 15px;
  left: 15px;
  font-size: 15px;
  font-weight: bold;
  transition: transform .15s ease;
  transform-origin: center;
}

/* =========================
   الجوال
========================= */

@media (max-width: 600px) {

  .header {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .header-center {
    grid-column: 1 / 3;
    grid-row: 1;
    order: 1;
  }

  .header-right {
    order: 2;
    justify-content: flex-start;
  }

  .header-left {
    order: 3;
    text-align: right;
  }

  .saudi-logo {
    width: 58px;
    height: 58px;
  }

  .saudi-logo img {
    width: 58px;
    height: 58px;
  }

  .activity-title {
    font-size: 17px;
  }

  button {
    min-width: 100%;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- =========================
       الرأس
  ========================== -->

  <div class="header">

    <div class="header-right">
      <span>وزارة الداخلية</span>

      <div class="saudi-logo">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/9/99/Emblem_of_Saudi_Arabia.svg"
          alt="شعار المملكة العربية السعودية">
      </div>
    </div>

    <div class="header-center">
      تطبيق حسب النقاط
    </div>

    <div class="header-left">
      KR
    </div>

  </div>


  <!-- =========================
       الأعمال
  ========================== -->

  <div id="activities"></div>


  <!-- =========================
       المجموع
  ========================== -->

  <div class="total-box">
    المجموع:
    <span id="total">0</span>
  </div>


  <!-- =========================
       الأزرار
  ========================== -->

  <div class="buttons">

    <button
      class="save-btn"
      id="saveBtn"
      type="button">
      حفظ البيانات
    </button>

    <button
      class="delete-btn"
      id="deleteBtn"
      type="button">
      حذف البيانات
    </button>

    <button
      class="motion-btn"
      id="motionBtn"
      type="button">
      السماح بحركة الجهاز
    </button>

  </div>

</div>


<!-- التصميم -->

<div id="designCredit" class="design-credit">
  تصميم: عادل الشمري
</div>


<script>

/* =========================================
   الأعمال والنقاط
========================================= */

const activities = [

  {
    name: "تدشين نقطة تفتيش متحركة",
    points: 1,
    note: "كل ١/٢ ساعة"
  },

  {
    name: "إستيقاف مروري",
    points: 1,
    note: ""
  },

  {
    name: "تسجيل مخالفة",
    points: 1,
    note: ""
  },

  {
    name: "حضور حملة أمنية (عامة)",
    points: 2,
    note: ""
  },

  {
    name: "حضور حملة أمنية (خاصة)",
    points: 2,
    note: ""
  },

  {
    name: "حضور تدريب (عام-خاص)",
    points: 2,
    note: ""
  },

  {
    name: "إسقاط رجل عصابة",
    points: 2,
    note: ""
  },

  {
    name: "حضور تمشيط",
    points: 3,
    note: ""
  },

  {
    name: "إعتقال عضو عصابة",
    points: 3,
    note: ""
  },

  {
    name: "إعتقال احد رؤساء العصابات",
    points: 5,
    note: "ملاحظة"
  },

  {
    name: "إعتقال احد مسؤولي العصابات",
    points: 20,
    note: "ملاحظة"
  }

];


/* =========================================
   إنشاء الأعمال
========================================= */

const activitiesContainer =
  document.getElementById("activities");

activities.forEach(function(activity, index) {

  const box = document.createElement("div");

  box.className = "activity";

  box.innerHTML = `
    <div class="activity-title">
      ${index + 1}. ${activity.name}
    </div>

    <div class="activity-points">
      (${activity.points})${activity.note ? " — " + activity.note : ""}
      ${activity.note === "كل ١/٢ ساعة" ? "" : ""}
    </div>

    <input
      class="activity-input"
      type="number"
      min="0"
      step="1"
      value="0"
      inputmode="numeric"
      data-index="${index}"
      placeholder="اكتب العدد">
  `;

  /*
    نضع ملاحظة كل نصف ساعة بشكل واضح
    تحت اسم النشاط الأول.
  */

  if (activity.note === "كل ١/٢ ساعة") {

    box.querySelector(".activity-points").innerHTML =
      "كل ١/٢ ساعة — (" + activity.points + ")";

  }

  activitiesContainer.appendChild(box);

});


/* =========================================
   حساب المجموع
========================================= */

function calculateTotal() {

  let total = 0;

  const inputs =
    document.querySelectorAll(".activity-input");

  inputs.forEach(function(input) {

    let number =
      parseInt(input.value, 10);

    if (isNaN(number) || number < 0) {
      number = 0;
    }

    const index =
      parseInt(input.dataset.index, 10);

    total +=
      number * activities[index].points;

  });

  document.getElementById("total").textContent =
    total.toLocaleString("ar-SA");

  return total;
}


/* =========================================
   تحديث الحساب عند الكتابة
========================================= */

document
  .querySelectorAll(".activity-input")
  .forEach(function(input) {

    input.addEventListener(
      "input",
      calculateTotal
    );

  });


/* =========================================
   حفظ البيانات
========================================= */

document
  .getElementById("saveBtn")
  .addEventListener("click", function() {

    const data = [];

    document
      .querySelectorAll(".activity-input")
      .forEach(function(input) {

        data.push(input.value);

      });

    localStorage.setItem(
      "adelPointsData",
      JSON.stringify(data)
    );

    alert("تم حفظ البيانات بنجاح");

  });


/* =========================================
   تحميل البيانات المحفوظة
========================================= */

function loadData() {

  const saved =
    localStorage.getItem("adelPointsData");

  if (!saved) {
    calculateTotal();
    return;
  }

  try {

    const data =
      JSON.parse(saved);

    document
      .querySelectorAll(".activity-input")
      .forEach(function(input, index) {

        if (data[index] !== undefined) {
          input.value = data[index];
        }

      });

  } catch (error) {

    console.error(error);

  }

  calculateTotal();
}


/* =========================================
   حذف البيانات
========================================= */

document
  .getElementById("deleteBtn")
  .addEventListener("click", function() {

    const confirmDelete =
      confirm("هل أنت متأكد من حذف جميع البيانات؟");

    if (!confirmDelete) {
      return;
    }

    document
      .querySelectorAll(".activity-input")
      .forEach(function(input) {

        input.value = 0;

      });

    localStorage.removeItem(
      "adelPointsData"
    );

    calculateTotal();

    alert("تم حذف البيانات");

  });


/* =========================================
   حركة عبارة تصميم: عادل الشمري
========================================= */

let motionEnabled = false;

document
  .getElementById("motionBtn")
  .addEventListener("click", async function() {

    try {

      /*
        أجهزة Apple تطلب إذن الحركة.
      */

      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {

        const permission =
          await DeviceOrientationEvent.requestPermission();

        if (permission !== "granted") {

          alert("لم يتم السماح بحركة الجهاز");

          return;
        }

      }

      if (motionEnabled) {

        alert("حركة الجهاز مفعلة بالفعل");

        return;
      }

      window.addEventListener(
        "deviceorientation",
        function(event) {

          let x =
            Number(event.gamma) || 0;

          let y =
            Number(event.beta) || 0;

          /*
            تحديد الحركة حتى لا تتحرك العبارة
            بشكل مبالغ فيه.
          */

          x =
            Math.max(-30, Math.min(30, x));

          y =
            Math.max(-30, Math.min(30, y));

          const credit =
            document.getElementById("designCredit");

          credit.style.transform =
            "translate(" +
            (x * 0.7) +
            "px," +
            (y * 0.25) +
            "px)";

        }
      );

      motionEnabled = true;

      this.textContent =
        "حركة الجهاز مفعلة";

      alert("تم السماح بحركة الجهاز");

    } catch (error) {

      console.error(error);

      alert("تعذر تفعيل حركة الجهاز");

    }

  });


/* =========================================
   تشغيل التطبيق
========================================= */

loadData();

</script>

</body>
</html>
