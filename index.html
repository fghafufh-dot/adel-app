<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تطبيق حسب النقاط</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f3f5f7;
    color:#111;
    min-height:100vh;
}

/* الهيدر */

header{
    background:#fff;
    min-height:95px;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #ddd;
}

/* شعار المملكة */

.saudi-logo{
    width:82px;
    height:82px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.saudi-logo img{
    width:82px;
    height:82px;
    display:block;
    object-fit:contain;
}

/* الجهة اليمنى */

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.ministry{
    font-size:20px;
    font-weight:bold;
}

/* KR */

.kr{
    font-size:25px;
    font-weight:900;
    direction:ltr;
}

/* المحتوى */

.container{
    width:92%;
    max-width:900px;
    margin:30px auto;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    font-size:30px;
    margin-bottom:8px;
}

.title p{
    color:#777;
}

/* البطاقات */

.card{
    background:#fff;
    border-radius:16px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.card h2{
    margin-bottom:18px;
}

/* الإدخال */

.form{
    display:grid;
    grid-template-columns:1fr 1fr 130px;
    gap:10px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#111;
}

button{
    border:0;
    border-radius:10px;
    background:#111;
    color:#fff;
    padding:14px;
    font-size:16px;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

/* مجموع النقاط */

.total{
    background:#111;
    color:#fff;
    border-radius:16px;
    text-align:center;
    padding:25px;
    margin-bottom:20px;
}

.total-title{
    font-size:17px;
    margin-bottom:8px;
}

.total-number{
    font-size:42px;
    font-weight:bold;
}

/* النشاط */

.activity{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:15px;
}

.activity-info{
    flex:1;
}

.activity-name{
    font-size:18px;
    font-weight:bold;
    margin-bottom:6px;
}

.activity-user{
    color:#777;
    font-size:14px;
}

.activity-points{
    font-weight:bold;
    font-size:18px;
}

.delete{
    background:#c62828;
    padding:9px 13px;
    font-size:14px;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}

/* المصمم */

footer{
    text-align:center;
    color:#666;
    padding:25px;
    font-size:14px;
}

/* الجوال */

@media(max-width:600px){

    header{
        min-height:70px;
        padding:6px 12px;
    }

    .saudi-logo{
        width:58px;
        height:58px;
    }

    .saudi-logo img{
        width:58px;
        height:58px;
    }

    .ministry{
        font-size:16px;
    }

    .kr{
        font-size:20px;
    }

    .container{
        width:94%;
        margin:20px auto;
    }

    .title h1{
        font-size:25px;
    }

    .form{
        grid-template-columns:1fr;
    }

    .activity{
        flex-wrap:wrap;
    }

    .activity-info{
        width:100%;
    }

    .activity-points{
        flex:1;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-right">

        <div class="saudi-logo">
            <span style="font-size:38px;">⚔️🌴</span>
        </div>

        <div class="ministry">
            وزارة الداخلية
        </div>

    </div>

    <div class="kr">
        KR
    </div>

</header>


<main class="container">

    <div class="title">
        <h1>تطبيق حسب النقاط</h1>
        <p>نظام حساب وإدارة النقاط</p>
    </div>


    <div class="card">

        <h2>إضافة نشاط</h2>

        <div class="form">

            <input
                id="username"
                type="text"
                placeholder="اسم المستخدم"
            >

            <input
                id="activity"
                type="text"
                placeholder="اسم النشاط"
            >

            <input
                id="points"
                type="number"
                min="0"
                placeholder="النقاط"
            >

            <button onclick="addActivity()">
                إضافة النشاط
            </button>

        </div>

    </div>


    <div class="total">

        <div class="total-title">
            مجموع النقاط
        </div>

        <div
            class="total-number"
            id="totalPoints"
        >
            0
        </div>

    </div>


    <div class="card">

        <h2>الأنشطة</h2>

        <div id="activities">

            <div class="empty">
                لا توجد أنشطة مضافة
            </div>

        </div>

    </div>

</main>


<footer>
    المصمم: عادل الشمري
</footer>


<script>

let activities =
    JSON.parse(
        localStorage.getItem("adel_points") || "[]"
    );


function save(){

    localStorage.setItem(
        "adel_points",
        JSON.stringify(activities)
    );

}


function addActivity(){

    const username =
        document.getElementById("username").value.trim();

    const activity =
        document.getElementById("activity").value.trim();

    const points =
        Number(
            document.getElementById("points").value
        );


    if(username === ""){

        alert("اكتب اسم المستخدم");

        return;

    }


    if(activity === ""){

        alert("اكتب اسم النشاط");

        return;

    }


    if(points <= 0){

        alert("اكتب عدد النقاط");

        return;

    }


    activities.push({

        username:username,

        activity:activity,

        points:points

    });


    save();


    document.getElementById("username").value = "";

    document.getElementById("activity").value = "";

    document.getElementById("points").value = "";


    showActivities();

}


function deleteActivity(index){

    activities.splice(index,1);

    save();

    showActivities();

}


function showActivities(){

    const box =
        document.getElementById("activities");

    const total =
        document.getElementById("totalPoints");


    if(activities.length === 0){

        box.innerHTML =
            '<div class="empty">لا توجد أنشطة مضافة</div>';

        total.textContent = "0";

        return;

    }


    box.innerHTML = "";


    let sum = 0;


    activities.forEach(function(item,index){

        sum += Number(item.points);


        const div =
            document.createElement("div");

        div.className = "activity";


        div.innerHTML = `

            <div class="activity-info">

                <div class="activity-name">
                    ${safe(item.activity)}
                </div>

                <div class="activity-user">
                    المستخدم:
                    ${safe(item.username)}
                </div>

            </div>

            <div class="activity-points">
                ${item.points} نقطة
            </div>

            <button
                class="delete"
                onclick="deleteActivity(${index})"
            >
                حذف
            </button>

        `;


        box.appendChild(div);

    });


    total.textContent = sum;

}


function safe(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


showActivities();

</script>

</body>
</html>
