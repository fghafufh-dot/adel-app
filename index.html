<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تطبيق حسب النقاط</title>

<style>
* {
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    background: #f3f3f3;
    color: #111;
    font-family: Arial, Tahoma, sans-serif;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 18px;
}

/* =========================================
   الرأس
========================================= */

.header {
    position: relative;
    width: 100%;
    min-height: 105px;
    background: #fff;
    border-radius: 18px;
    margin-bottom: 20px;
    padding: 15px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* عنوان التطبيق */

.header-title {
    width: 100%;
    text-align: center;
    font-size: clamp(20px, 3vw, 30px);
    font-weight: 700;
    line-height: 1.4;
    padding: 0 190px;
}

/* وزارة الداخلية */

.header-right {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);

    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;

    font-size: clamp(15px, 2vw, 21px);
    font-weight: 700;

    white-space: nowrap;
}

/* KR */

.header-left {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);

    direction: ltr;
    text-align: left;

    font-size: clamp(19px, 2.5vw, 27px);
    font-weight: 700;
}

/* =========================================
   شعار السعودية
========================================= */

.saudi-logo {
    width: 72px;
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.saudi-logo img {
    width: 72px;
    height: 72px;

    display: block;

    object-fit: contain;
}

/* =========================================
   الأعمال
========================================= */

#activities {
    width: 100%;
}

.activity {
    width: 100%;
    background: #fff;
    border-radius: 16px;

    padding: 18px;
    margin-bottom: 14px;

    box-shadow: 0 2px 9px rgba(0, 0, 0, 0.10);

    overflow: hidden;
}

.activity-title {
    width: 100%;

    font-size: clamp(17px, 2.5vw, 22px);
    font-weight: 700;

    line-height: 1.6;

    overflow-wrap: anywhere;
    word-break: normal;
}

.activity-points {
    width: 100%;

    color: #555;

    font-size: clamp(15px, 2vw, 18px);

    line-height: 1.5;

    margin-top: 5px;
    margin-bottom: 12px;

    overflow-wrap: anywhere;
}

/* =========================================
   خانات الأرقام
========================================= */

.activity-input {
    display: block;

    width: 100%;
    height: 50px;

    border: 1px solid #aaa;
    border-radius: 11px;

    background: #fff;

    padding: 8px 14px;

    font-family: Arial, Tahoma, sans-serif;
    font-size: 19px;

    text-align: center;

    outline: none;

    -webkit-appearance: none;
    appearance: none;
}

.activity-input:focus {
    border-color: #111;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.06);
}

/* =========================================
   المجموع
========================================= */

.total-box {
    width: 100%;

    background: #111;
    color: #fff;

    border-radius: 16px;

    padding: 19px;

    margin-top: 20px;

    text-align: center;

    font-size: clamp(21px, 3vw, 27px);
    font-weight: 700;
}

/* =========================================
   الأزرار
========================================= */

.buttons {
    width: 100%;

    display: flex;
    flex-wrap: wrap;

    gap: 10px;

    margin-top: 15px;
}

button {
    min-height: 48px;

    border: 0;
    border-radius: 11px;

    padding: 12px 18px;

    font-family: Arial, Tahoma, sans-serif;
    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    flex: 1 1 200px;
}

button:active {
    transform: scale(0.98);
}

.save-btn {
    background: #111;
    color: #fff;
}

.delete-btn {
    background: #c62828;
    color: #fff;
}

.motion-btn {
    background: #ddd;
    color: #111;
}

/* =========================================
   التصميم
========================================= */

.design-credit {
    width: 100%;

    margin-top: 25px;
    margin-bottom: 20px;

    text-align: center;

    font-size: clamp(14px, 2vw, 17px);
    font-weight: 700;

    transition: transform 0.15s ease;

    transform-origin: center;
}

/* =========================================
   شاشات متوسطة - آيباد
========================================= */

@media (max-width: 800px) {

    .container {
        max-width: 760px;
        padding: 15px;
    }

    .header {
        min-height: 120px;
    }

    .header-title {
        padding: 0 175px;
        font-size: 21px;
    }

    .header-right {
        right: 12px;
        font-size: 15px;
        gap: 7px;
    }

    .header-left {
        left: 12px;
        font-size: 21px;
    }

    .saudi-logo {
        width: 62px;
        height: 62px;
    }

    .saudi-logo img {
        width: 62px;
        height: 62px;
    }
}

/* =========================================
   الجوال
========================================= */

@media (max-width: 600px) {

    .container {
        width: 100%;
        padding: 10px;
    }

    .header {
        min-height: 145px;

        padding: 10px;

        border-radius: 15px;

        display: flex;
        align-items: flex-end;
        justify-content: center;
    }

    /* KR */

    .header-left {
        left: 12px;
        top: 14px;

        transform: none;

        font-size: 21px;
    }

    /* وزارة الداخلية */

    .header-right {
        right: 10px;
        top: 10px;

        transform: none;

        font-size: 13px;

        gap: 5px;
    }

    /* الشعار */

    .saudi-logo {
        width: 48px;
        height: 48px;
    }

    .saudi-logo img {
        width: 48px;
        height: 48px;
    }

    /* عنوان التطبيق */

    .header-title {
        padding: 0;

        margin-bottom: 13px;

        font-size: 20px;

        line-height: 1.4;

        width: 100%;
    }

    .activity {
        padding: 15px;
        border-radius: 14px;
        margin-bottom: 12px;
    }

    .activity-title {
        font-size: 18px;
        line-height: 1.55;
    }

    .activity-points {
        font-size: 15px;
        margin-top: 4px;
        margin-bottom: 10px;
    }

    .activity-input {
        height: 48px;
        font-size: 18px;
    }

    .total-box {
        padding: 17px;
        font-size: 22px;
    }

    .buttons {
        gap: 8px;
    }

    button {
        flex: 1 1 100%;
        width: 100%;
    }

    .design-credit {
        margin-top: 22px;
        margin-bottom: 15px;
        font-size: 15px;
    }
}

/* =========================================
   الجوال الصغير جدًا
========================================= */

@media (max-width: 380px) {

    .header {
        min-height: 140px;
    }

    .header-right {
        font-size: 12px;
    }

    .header-left {
        font-size: 19px;
    }

    .saudi-logo {
        width: 43px;
        height: 43px;
    }

    .saudi-logo img {
        width: 43px;
        height: 43px;
    }

    .header-title {
        font-size: 18px;
    }

    .activity-title {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- =================================
         الرأس
    ================================== -->

    <header class="header">

        <!-- اليمين -->
        <div class="header-right">

            <span>وزارة الداخلية</span>

            <div class="saudi-logo">
                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/9/99/Emblem_of_Saudi_Arabia.svg"
                    alt="شعار المملكة العربية السعودية"
                >
            </div>

        </div>


        <!-- المنتصف -->
        <div class="header-title">
            تطبيق حسب النقاط
        </div>


        <!-- اليسار -->
        <div class="header-left">
            KR
        </div>

    </header>


    <!-- =================================
         الأعمال
    ================================== -->

    <main id="activities"></main>


    <!-- =================================
         المجموع
    ================================== -->

    <div class="total-box">

        المجموع:
        <span id="total">0</span>

    </div>


    <!-- =================================
         الأزرار
    ================================== -->

    <div class="buttons">

        <button
            id="saveBtn"
            class="save-btn"
            type="button">
            حفظ البيانات
        </button>

        <button
            id="deleteBtn"
            class="delete-btn"
            type="button">
            حذف البيانات
        </button>

        <button
            id="motionBtn"
            class="motion-btn"
            type="button">
            السماح بحركة الجهاز
        </button>

    </div>


    <!-- =================================
         التصميم
    ================================== -->

    <div
        id="designCredit"
        class="design-credit">

        تصميم: عادل الشمري

    </div>

</div>


<script>

/* =========================================
   الأعمال والنقاط
========================================= */

const activities = [

    {
        name: "تدشين نقطة تفتيش متحركة",
        points: 1,
        note: "كل ١/٢ ساعة"
    },

    {
        name: "إستيقاف مروري",
        points: 1,
        note: ""
    },

    {
        name: "تسجيل مخالفة",
        points: 1,
        note: ""
    },

    {
        name: "حضور حملة أمنية (عامة)",
        points: 2,
        note: ""
    },

    {
        name: "حضور حملة أمنية (خاصة)",
        points: 2,
        note: ""
    },

    {
        name: "حضور تدريب (عام-خاص)",
        points: 2,
        note: ""
    },

    {
        name: "إسقاط رجل عصابة",
        points: 2,
        note: ""
    },

    {
        name: "حضور تمشيط",
        points: 3,
        note: ""
    },

    {
        name: "إعتقال عضو عصابة",
        points: 3,
        note: ""
    },

    {
        name: "إعتقال احد رؤساء العصابات",
        points: 5,
        note: "ملاحظة"
    },

    {
        name: "إعتقال احد مسؤولي العصابات",
        points: 20,
        note: "ملاحظة"
    }

];


/* =========================================
   إنشاء الأعمال
========================================= */

const activitiesContainer =
    document.getElementById("activities");


activities.forEach(function(activity, index) {

    const box =
        document.createElement("section");

    box.className = "activity";


    let pointsText = "";


    if (activity.note === "كل ١/٢ ساعة") {

        pointsText =
            "كل ١/٢ ساعة — (" +
            activity.points +
            ")";

    } else if (activity.note === "ملاحظة") {

        pointsText =
            "ملاحظة — (" +
            activity.points +
            ")";

    } else {

        pointsText =
            "(" +
            activity.points +
            ")";

    }


    box.innerHTML = `

        <div class="activity-title">
            ${index + 1}. ${activity.name}
        </div>

        <div class="activity-points">
            ${pointsText}
        </div>

        <input
            class="activity-input"
            type="number"
            min="0"
            step="1"
            value="0"
            inputmode="numeric"
            data-index="${index}"
            aria-label="${activity.name}"
            placeholder="اكتب العدد">

    `;


    activitiesContainer.appendChild(box);

});


/* =========================================
   حساب النقاط
========================================= */

function calculateTotal() {

    let total = 0;


    const inputs =
        document.querySelectorAll(
            ".activity-input"
        );


    inputs.forEach(function(input) {

        let number =
            parseInt(input.value, 10);


        if (
            isNaN(number) ||
            number < 0
        ) {

            number = 0;

        }


        const index =
            parseInt(
                input.dataset.index,
                10
            );


        if (
            !isNaN(index) &&
            activities[index]
        ) {

            total +=
                number *
                activities[index].points;

        }

    });


    document.getElementById("total").textContent =
        total.toLocaleString("ar-SA");


    return total;
}


/* =========================================
   تحديث المجموع
========================================= */

document
    .querySelectorAll(".activity-input")
    .forEach(function(input) {

        input.addEventListener(
            "input",
            calculateTotal
        );

    });


/* =========================================
   حفظ البيانات
========================================= */

document
    .getElementById("saveBtn")
    .addEventListener(
        "click",
        function() {

            const data = [];


            document
                .querySelectorAll(
                    ".activity-input"
                )
                .forEach(function(input) {

                    data.push(input.value);

                });


            localStorage.setItem(
                "adelPointsData",
                JSON.stringify(data)
            );


            alert(
                "تم حفظ البيانات بنجاح"
            );

        }
    );


/* =========================================
   تحميل البيانات
========================================= */

function loadData() {

    const saved =
        localStorage.getItem(
            "adelPointsData"
        );


    if (!saved) {

        calculateTotal();

        return;
    }


    try {

        const data =
            JSON.parse(saved);


        if (!Array.isArray(data)) {

            calculateTotal();

            return;
        }


        const inputs =
            document.querySelectorAll(
                ".activity-input"
            );


        inputs.forEach(
            function(input, index) {

                if (
                    data[index] !== undefined
                ) {

                    input.value =
                        data[index];

                }

            }
        );


    } catch (error) {

        console.error(
            "خطأ في تحميل البيانات:",
            error
        );

    }


    calculateTotal();
}


/* =========================================
   حذف البيانات
========================================= */

document
    .getElementById("deleteBtn")
    .addEventListener(
        "click",
        function() {

            const confirmed =
                confirm(
                    "هل أنت متأكد من حذف جميع البيانات؟"
                );


            if (!confirmed) {

                return;

            }


            document
                .querySelectorAll(
                    ".activity-input"
                )
                .forEach(function(input) {

                    input.value = "0";

                });


            localStorage.removeItem(
                "adelPointsData"
            );


            calculateTotal();


            alert(
                "تم حذف البيانات"
            );

        }
    );


/* =========================================
   حركة عبارة التصميم
========================================= */

let motionEnabled = false;


document
    .getElementById("motionBtn")
    .addEventListener(
        "click",
        async function() {

            try {

                /*
                 * أجهزة Apple قد تطلب إذن
                 * الوصول إلى حركة الجهاز.
                 */

                if (
                    typeof DeviceOrientationEvent !==
                    "undefined" &&
                    typeof DeviceOrientationEvent
                        .requestPermission ===
                    "function"
                ) {

                    const permission =
                        await DeviceOrientationEvent
                            .requestPermission();


                    if (
                        permission !==
                        "granted"
                    ) {

                        alert(
                            "لم يتم السماح بحركة الجهاز"
                        );

                        return;
                    }
                }


                if (motionEnabled) {

                    alert(
                        "حركة الجهاز مفعلة بالفعل"
                    );

                    return;
                }


                window.addEventListener(
                    "deviceorientation",
                    function(event) {

                        let horizontal =
                            Number(
                                event.gamma
                            ) || 0;


                        let vertical =
                            Number(
                                event.beta
                            ) || 0;


                        horizontal =
                            Math.max(
                                -30,
                                Math.min(
                                    30,
                                    horizontal
                                )
                            );


                        vertical =
                            Math.max(
                                -30,
                                Math.min(
                                    30,
                                    vertical
                                )
                            );


                        const credit =
                            document.getElementById(
                                "designCredit"
                            );


                        credit.style.transform =
                            "translate(" +
                            (horizontal * 0.7) +
                            "px, " +
                            (vertical * 0.25) +
                            "px)";

                    },
                    {
                        passive: true
                    }
                );


                motionEnabled = true;


                this.textContent =
                    "حركة الجهاز مفعلة";


                alert(
                    "تم السماح بحركة الجهاز"
                );


            } catch (error) {

                console.error(error);


                alert(
                    "تعذر تفعيل حركة الجهاز"
                );

            }

        }
    );


/* =========================================
   تشغيل التطبيق
========================================= */

loadData();

</script>

</body>
</html>
